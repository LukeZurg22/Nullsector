- type: entity
  parent: SyndieMessengerGiftBox
  id: ZombieGiftBox
  name: zombie loot
  description: Loot boxes? Here? In the end times?
  abstract: true
  categories: [ HideSpawnMenu ]
  suffix: NPC Loot
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    layers:
    - state: icon-base
      color: "#B2B2B2"
    - state: icon-sling
      color: "#776756"
    - state: icon-clasp
      color: "#eeeeee"
  - type: Clothing
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    clothingVisuals:
      back:
      - state: base-equipped-BACKPACK
        color: "#B2B2B2"
      - state: sling-equipped-BACKPACK
        color: "#776756"
      - state: clasp-equipped-BACKPACK
        color: "#eeeeee"
  - type: Item
    inhandVisuals:
      left:
      - state: base-inhand-left
        color: "#B2B2B2"
      - state: clasp-inhand-left
        color: "#eeeeee"
      right:
      - state: base-inhand-right
        color: "#B2B2B2"
      - state: clasp-inhand-right
        color: "#eeeeee"

# Loot
- type: entityTable
  id: TableZombieLoot
  table: !type:AllSelector
    children:
    - id: FoodMeatRotten
      amount: !type:RangeNumberSelector
        range: 1, 3
    # Cash
    - !type:GroupSelector
      children:
      - id: SpaceCash100
        weight: 0.1
      - id: SpaceCash500
        weight: 0.2
      - id: SpaceCash1000
        weight: 0.4
      - id: SpaceCash2500
        weight: 0.3
    # Things
    - !type:GroupSelector
      children:
      - id: TreasureSampleTube
        weight: 0.4
      - id: ScrapTube
        weight: 0.6
    # Meds
    - !type:GroupSelector
      rolls: !type:RangeNumberSelector
        range: -1, 1
      children:
      - id: PillCharcoal
      - id: PillHyronalin
      - id: PillTricordrazine
      - id: Gauze1
      - id: Brutepack1
      - id: ChemistryBottleMysteryLiquid
        weight: 0.05


# Loot Spawner
- type: entity
  parent: MarkerBasePlaceFree
  id: SpawnZombieLoot
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    offset: 0.15
    table: !type:NestedSelector
      tableId: TableZombieLoot
      prob: 1.00

- type: entity
  parent: ZombieGiftBox
  id: ClothingBackpackZombieLootA
  name: zombie loot bundle
  #categories: [ HideSpawnMenu ]
  components:
  - type: SpawnItemsOnUse
    items:
    - id: SpawnZombieLoot
      prob: 1
      amount: 1
    sound:
      path: /Audio/Items/jumpsuit_equip.ogg