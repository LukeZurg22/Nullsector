- type: entity
  id: BasePressurePlate
  name: pressure plate
  abstract: true
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
    - type: Fixtures
      fixtures:
        floortrap:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.1,-0.1,0.1,0.1"
          hard: false
          mask:
            - ItemMask
          layer:
            - SlipLayer
    - type: Clickable
    - type: InteractionOutline
    - type: Physics
    - type: TriggerSignalOnCollide
      fixtureID: floortrap
      onPort: Pressed
      offPort: Pressed
      statusPort: Pressed
    - type: DeviceNetwork
      deviceNetId: Wireless
    - type: WirelessNetworkConnection
      range: 300
    - type: DeviceLinkSource
      ports:
        - Pressed
    - type: Tag
      tags:
      - Structure
      #- HideContextMenu

- type: entity
  id: PressurePlateIndestructible
  parent: BasePressurePlate
  suffix: Indestructible
  placement:
    mode: SnapgridCenter
  components:
    - type: Marker
    - type: Sprite
      sprite: _Null/Structures/pressure_plate.rsi
      state: icon

- type: entity
  parent: BasePressurePlate
  id: PressurePlate
  suffix: Destructible
  components:
    - type: Sprite
      drawdepth: WallMountedItems
      sprite: _Null/Structures/pressure_plate.rsi
      state: icon
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
