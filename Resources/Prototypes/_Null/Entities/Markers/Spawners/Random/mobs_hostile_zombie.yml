# Random Common (Infectiouslos)
- type: entityTable
  id: TableZombieRandomCommonInfectiouslos
  table: !type:GroupSelector
    children:
    - id: MobInfectiouslosZombieRegular
      weight: 0.6
    - id: MobInfectiouslosZombiePilot
      weight: 0.4

# Spawner Random Common (Infectiouslos)
- type: entity
  parent: MarkerBase
  id: SpawnMobZombieInfectiouslos
  name: zombie spawner common
  suffix: AI, Hostile, Non-Infectious
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _Null/Mobs/zombies.rsi
        state: icon
      - sprite: _NF/Markers/general.rsi
        state: questionmark
        color: green
  - type: EntityTableSpawner
    offset: 0.0
    table: !type:NestedSelector
      tableId: TableZombieRandomCommonInfectiouslos
      prob: 1.00

# Total Random
- type: entityTable
  id: TableZombieRandom
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: TableZombieRandomCommon
      weight: 0.7
    - !type:NestedSelector
      tableId: TableZombieRandomSpecial
      weight: 0.3

# Random Common
- type: entityTable
