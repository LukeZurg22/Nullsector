- type: entity
  name: ion-plasma laser rifle
  parent: [BaseWeaponPowerCell]
  id: WeaponLaserIonPlasma
  description: This modified laser rifle fires nearly harmless beams in the 40-watt range.
  components:
  - type: Sprite
    sprite: _Null/Objects/Weapons/ionised_plasma_rifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    size: Huge
    shape:
    - 0,0,4,3
  - type: Clothing
    sprite: _Null/Weapons/ionised_plasma_rifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: PowerCellSmall
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  # - type: Wieldable
  # - type: GunWieldBonus
    # minAngle: -20
    # maxAngle: -20
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
 # - type: HitscanBatteryAmmoProvider
   # proto: IonLaser
   # fireCost: 62.5
  - type: StaticPrice
    price: 800
  - type: EmitSoundOnPickup # Goobstation edit start
    sound:
      collection: LasersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: LasersDrop
  - type: EmitSoundOnLand
    sound:
      collection: LasersDrop # Goobstation edit end

