# Abstract Type
- type: entity
  id: Monolith
  parent: BaseStructure
  name: monolith
  description: An ancient structure.
  abstract: true
  components:
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-0.5,0.5,1" # Left, Down, Right, Up
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: StationAnchor
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite  # Place w. Direction Facing "SOUTH" for best results.
    noRot: true
    sprite: _Null/Objects/Fun/nullith.rsi
    drawdepth: Mobs
    offset: -0.25, 0.50
  - type: PointLight
    enabled: true
    color: "#FFFFFF"
    radius: 12.0
    energy: 7.5
  - type: ActivatableUI
    singleUser: true
    key: enum.NullithConsoleUiKey.Monolith
  - type: UserInterface
    interfaces:
      enum.NullithConsoleUiKey.Monolith:
        type: NullithConsoleBoundUserInterface
  - type: NullithConsole
    targetIdSlot:
      name: id-card-console-target-id
      ejectSound: /Audio/Items/bottle_clunk_2.ogg
      insertSound: /Audio/Items/bottle_clunk.ogg
      ejectOnBreak: true
      swap: true
      whitelist:
        components:
        - IdCard
        - NullithVoucher
      #newAccessLevels: [Captain] # Not providing any new access levels, for now as of 20251202.
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container
      ShipyardConsole-targetId: !type:ContainerSlot
  #- type: PurchasablePoIListing # Forces specific entries.
  - type: Computer
    board: Null # a null-type of board. Not the literal "Null" sector.
    # WIP : Add power generation.
   
# Null Sector : Various Monolith Implementations
- type: entity
  id: MonolithNullith
  parent: Monolith
  suffix: nullith
  components:
  - type: Sprite
    state: nullith
  - type: PointLight
    color: "#FF0040"
    
- type: entity
  id: MonolithNGC
  parent: Monolith
  description: An ancient structure. Dubbed as "The Honorary Tombstone" by the NGC.
  suffix: NGC
  components:
  - type: Sprite
    state: NGC
  - type: PointLight
    color: "#0000FA"
    
- type: entity
  id: MonolithCube
  parent: Monolith
  description: The Cube! The Cube! The Cube!
  suffix: cube
  components:
  - type: Sprite
    state: cube
  - type: PointLight
    color: "#FFFF00"  

- type: entity
  id: MonolithArmadan
  parent: Monolith
  description: Depicts a time-accurate map of the entire galaxy.
  suffix: armadith
  components:
  - type: Sprite
    state: armadith
  - type: PointLight
    color: "#FF0000"  