- type: constructionGraph
  id: FanConstruction
  start: start
  graph:
  - node: start
    edges:
    - to: tinyfan
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

  - node: tinyfan
    entity: AtmosDeviceFanTiny
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Welding
        doAfter: 1
