# Anyway
# See WallRock variants for the remappings.
# Basalt variants
- type: entity
  id: WallRockBasalt
  name: basalt
  parent: WallRock
  components:
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock_wall
    - type: Sprite
      sprite: Structures/Walls/rock.rsi
      layers:
        - state: rock_wall
        - map: [ "enum.EdgeLayer.South" ]
          state: rock_wall_south
        - map: [ "enum.EdgeLayer.East" ]
          state: rock_wall_east
        - map: [ "enum.EdgeLayer.North" ]
          state: rock_wall_north
        - map: [ "enum.EdgeLayer.West" ]
          state: rock_wall_west

- type: entity
  id: WallRockBasaltCoal
  parent: NFWallRockBasaltOre # Frontier: WallRockBasalt<NFWallRockBasaltOre
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: NFOreCoal # Frontier: NF prefix
    - type: Sprite
      layers:
        - state: rock_wall
        - map: [ "enum.EdgeLayer.South" ]
          state: rock_wall_south
        - map: [ "enum.EdgeLayer.East" ]
          state: rock_wall_east
        - map: [ "enum.EdgeLayer.North" ]
          state: rock_wall_north
        - map: [ "enum.EdgeLayer.West" ]
          state: rock_wall_west
        - state: rock_coal
          map: [ "enum.MiningScannerVisualLayers.Overlay" ]
          visible: false

