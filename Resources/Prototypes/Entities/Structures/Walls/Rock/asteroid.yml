#Asteroid rock
- type: entity
  id: AsteroidRock
  parent: BaseWall
  name: asteroid rock
  description: A rocky asteroid.
  components:
  - type: Transform
    noRot: true
  - type: Damageable
    damageContainer: Inorganic # Frontier: StructuralInorganic<Inorganic
    damageModifierSet: Metallic # Frontier: Rock<Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150 # Frontier: 120<150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: SoundOnGather # Frontier
  - type: Gatherable # Frontier
    toolWhitelist: # Frontier
      tags: # Frontier
      - Pickaxe # Frontier
      components: # Frontier
      - MiningGatheringHard # Frontier
      - MiningGatheringSoft # Frontier
  - type: MiningScannerViewable
  - type: Icon
    sprite: _TC14/Structures/Walls/stone.rsi
    state: full
  - type: IconSmooth
    key: walls
    base: stone
  - type: Sprite
    sprite: _TC14/Structures/Walls/stone.rsi

# Ore veins
- type: entity
  id: AsteroidRockCoal
  parent: NFAsteroidRockOre # Frontier: AsteroidRock<NFAsteroidRockOre
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: NFOreCoal # Frontier: NF prefix
    - type: Sprite
      layers:
        - map: [ "enum.CornerLayers.SE" ]
          state: stone0
        - map: [ "enum.CornerLayers.SW" ]
          state: stone0
        - map: [ "enum.CornerLayers.NE" ]
          state: stone0
        - map: [ "enum.CornerLayers.NW" ]
          state: stone0
        - state: rock_coal
          sprite: Structures/Walls/rock.rsi
          map: [ "enum.MiningScannerVisualLayers.Overlay" ]
          visible: false


