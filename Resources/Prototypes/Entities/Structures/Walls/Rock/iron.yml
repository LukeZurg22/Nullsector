- type: entity
  id: IronRock
  parent: NFAsteroidRockOre # Frontier: AsteroidRock<NFAsteroidRockOre
  name: ironrock
  suffix: Low Ore Yield
  description: A rocky asteroid.
  components:
  - type: Icon
    sprite: _TC14/Structures/Walls/stone.rsi
    state: full
  #- type: SmoothEdge # Null Sector - No sprites made for this yet. It's cool, though.
  - type: Sprite
    color: "#C56251FF"

- type: entity
  id: IronRockMining
  parent: NFIronRockOre # Frontier: IronRock<NFIronRockOre
  name: ironrock
  suffix: higher ore yield
  description: An asteroid.
  components:
  - type: OreVein
    oreChance: 0.33
    oreRarityPrototypeId: RandomOreDistributionStandard

# Ore veins
- type: entity
  id: IronRockCoal
  parent: NFIronRockOre # Frontier: IronRock<NFIronRockOre
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: NFOreCoal # Frontier: NF prefix
    - type: Sprite
      layers:
        - state: rock_coal
          sprite: Structures/Walls/rock.rsi
          map: [ "enum.MiningScannerVisualLayers.Overlay" ]
          visible: false

