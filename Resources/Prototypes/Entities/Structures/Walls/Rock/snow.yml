# Snow variants
- type: entity
  id: WallRockSnow
  name: snowdrift
  parent: WallRock
  components:
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock_snow
    - type: Sprite
      color: "#76E0FFFF"

- type: entity
  id: WallRockSnowCoal
  parent: NFWallRockSnowOre # Frontier: WallRockSnow<NFWallRockSnowOre
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: NFOreCoal # Frontier: NF prefix
    - type: Sprite
      layers:
        - state: rock_coal
          sprite: Structures/Walls/rock.rsi
          map: [ "enum.MiningScannerVisualLayers.Overlay" ]
          visible: false

