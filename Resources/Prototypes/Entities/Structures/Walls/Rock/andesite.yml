# Andesite variants
- type: entity
  id: WallRockAndesite
  name: andesite
  parent: NFWallRockOre # Frontier: WallRock<NFWallRockOre
  components:
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock_andesite
    - type: Sprite
      color: "#F07A78FF"

- type: entity
  id: WallRockAndesiteCoal
  parent: NFWallRockAndesiteOre # Frontier: WallRockAndesite<NFWallRockAndesiteOre
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: NFOreCoal # Frontier: NF prefix
    - type: Sprite
      layers:
        - state: rock_coal
          sprite: Structures/Walls/rock.rsi
          map: [ "enum.MiningScannerVisualLayers.Overlay" ]
          visible: false

