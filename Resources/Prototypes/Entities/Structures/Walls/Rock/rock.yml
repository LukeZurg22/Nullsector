# Rocks and ore veins
- type: entity
  id: WallRock
  parent: AsteroidRock
  name: rock
  suffix: planetmap
  components:
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Metallic
    - type: Sprite
      sprite: _TC14/Structures/Walls/stone.rsi
      color: "#FFECBAFF"

# Ore veins
- type: entity
  id: WallRockCoal
  parent: NFWallRockOre # Frontier: WallRock<NFWallRockOre
  description: An ore vein rich with coal.
  suffix: Coal
  components:
  - type: EntityRemap
    mask:
      AsteroidRock: AsteroidRockCoal
      WallRockBasalt: WallRockBasaltCoal
      WallRockChromite: WallRockChromiteCoal
      WallRockSand: WallRockSandCoal
      WallRockSnow: WallRockSnowCoal
  - type: OreVein
    oreChance: 1.0
    currentOre: NFOreCoal # Frontier: NF prefix
  - type: Sprite
    layers:
      - state: rock_coal
        sprite: Structures/Walls/rock.rsi
        map: [ "enum.MiningScannerVisualLayers.Overlay" ]
        visible: false

