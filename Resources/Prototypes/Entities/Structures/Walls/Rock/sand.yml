# Sand variants
- type: entity
  id: WallRockSand
  name: sandstone
  parent: WallRock
  components:
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock_sand
    - type: Sprite
      color: "#BC8304FF"

- type: entity
  id: WallRockSandCoal
  parent: NFWallRockSandOre # Frontier: WallRockSand<NFWallRockSandOre
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: NFOreCoal # Frontier: NF prefix
    - type: Sprite
      layers:
        - state: rock_coal
          sprite: Structures/Walls/rock.rsi
          map: [ "enum.MiningScannerVisualLayers.Overlay" ]
          visible: false

