# Chromite variants
- type: entity
  id: WallRockChromite
  name: chromite
  parent: NFWallRockOre # Frontier: WallRock<NFWallRockOre
  components:
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock_chromite
    - type: Sprite
      color: "#7C3678FF"

- type: entity
  id: WallRockChromiteCoal
  parent: NFWallRockChromiteOre # Frontier: WallRockChromite<NFWallRockChromiteOre
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: NFOreCoal # Frontier: NF prefix
    - type: Sprite
      layers:
        - state: rock_coal
          sprite: Structures/Walls/rock.rsi
          map: [ "enum.MiningScannerVisualLayers.Overlay" ]
          visible: false

