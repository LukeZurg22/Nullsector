    oreChance: 1.0
    currentOre: NFOreScrap
  - type: IconSmooth
    key: walls
    base: scrap
  - type: Icon
    sprite: _Null/Structures/Walls/scrap.rsi
    state: full
  - type: Sprite
    sprite: _Null/Structures/Walls/scrap.rsi
    layers:
    - map: [ "enum.CornerLayers.SE" ]
      state: scrap0
    - map: [ "enum.CornerLayers.SW" ]
      state: scrap0
    - map: [ "enum.CornerLayers.NE" ]
      state: scrap0
    - map: [ "enum.CornerLayers.NW" ]
      state: scrap0
    - state: rock_scrap
      sprite: Structures/Walls/rock.rsi
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]
      visible: false
