- type: entity
  parent: AsteroidRock
  id: NFAsteroidRockOre
  abstract: true
  components: &softRockComps
  - type: MiningScannerViewable
  - type: Sprite
    sprite: _TC14/Structures/Walls/stone.rsi
    layers:
    - map: [ "enum.CornerLayers.SE" ]
      state: stone0
    - map: [ "enum.CornerLayers.SW" ]
      state: stone0
    - map: [ "enum.CornerLayers.NE" ]
      state: stone0
    - map: [ "enum.CornerLayers.NW" ]
      state: stone0
  - type: OreVein
    gatherDestructionWhitelist:
      components:
      - MiningGatheringHard

- type: entity
  parent: IronRock
  id: NFIronRockOre
  abstract: true
  components: *softRockComps

- type: entity
  parent: WallRock
  id: NFWallRockOre
  abstract: true
  components: *softRockComps
- type: entity
  parent: WallRockBasalt
